<div>
  <h3>Ajouter un contact</h3>
  <div>
    <input [(ngModel)]="nom" placeholder="Nom" />
    <input [(ngModel)]="email" placeholder="Email" />
    <input type="number" [(ngModel)]="score" min="0" max="20" placeholder="Score" />
    <select [(ngModel)]="role">
      <option value="admin">Admin</option>
      <option value="user">Utilisateur</option>
      <option value="guest">Visiteur</option>
    </select>
    <button (click)="soumettre()">Ajouter</button>
  </div>
</div>
